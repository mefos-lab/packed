# What the literature says about each detection pattern.
#
# Every citation carries a `stance`, because a work can do opposite
# things to two patterns and a flat source list cannot express that:
#
#   supports    — the work is evidence the pattern targets something real
#   limits      — the work bounds what the pattern can be read to show
#   contradicts — the work is evidence against the pattern's premise
#
# `status` reflects what currently cites the pattern, and can move as
# sources are added:
#
#   PROPOSED    — reasoned from the data, no external grounding yet
#   SUPPORTED   — at least one work supports it, none contradict
#   CONTESTED   — a work contradicts it; read the citation before relying on it
#
# A pattern with no citations is not thereby wrong. It is ungrounded,
# which is a different and honest thing to report.

patterns:

  lobbyist_contribution_corroboration:
    status: PROPOSED
    note: >-
      Cross-source corroboration of a disclosed fact. Rests on the two
      filing regimes being independent rather than on any claim about
      influence, so the influence literature neither supports nor
      undercuts it.
    citations: []

  leadership_pac_transfers:
    status: SUPPORTED
    citations:
      - source: hall_wayman_1990
        stance: supports
        because: >-
          Locates contribution effects in committee work rather than
          floor votes, which is what makes tracing money to specific
          members worth doing at all.
      - source: oecd_lobbying_21c
        stance: limits
        because: >-
          Notes that disclosure regimes routinely fail to capture
          indirect routes. A leadership PAC is such a route, so what
          this pattern traces is a lower bound.

  jfc_obscuring:
    status: SUPPORTED
    citations:
      - source: ti_political_finance_standards
        stance: supports
        because: >-
          Names a level playing field and clean money as principles a
          finance regime should uphold. A structure letting one donor
          exceed any single participant's limit is squarely the case
          those principles address.
      - source: idea_lobbying_registers_2024
        stance: limits
        because: >-
          Comparative work on what registers capture. The split is
          disclosed but distributed across filings, so absence of an
          aggregate view is a reporting artefact, not absence of the
          relationship.

  lobbying_money_to_committee_seats:
    status: SUPPORTED
    citations:
      - source: hall_wayman_1990
        stance: supports
        because: >-
          The committee-seat framing is the paper's central finding:
          effects appear in committee, on participation. Aggregating a
          funder's giving by recipients' committee seats targets exactly
          that.
      - source: kalla_broockman_2016
        stance: supports
        because: >-
          Contributions buy access. Access is exercised through the
          committees a member sits on.
      - source: oecd_lobbying_principles
        stance: limits
        because: >-
          Treats lobbying transparency as the disclosure of who seeks to
          influence whom. This pattern shows where a firm's money lands,
          not what it lobbied for — LDA records the chamber, never the
          committee.

  industry_concentration:
    status: SUPPORTED
    citations:
      - source: hall_wayman_1990
        stance: supports
        because: >-
          Same basis as the lobbying-side pattern: committee
          participation is where money is measurably associated with
          legislative behaviour.
      - source: oecd_lobbying_21c
        stance: limits
        because: >-
          Indirect routes go unrecorded. Money reaching members through
          party committees is reported here as unattributed precisely
          because this limit is real.

  revolving_door:
    status: SUPPORTED
    note: >-
      Lobbyists who previously staffed the member or committee they now
      lobby, via LDA's `covered_position`. Reaches the committee level
      that dual_role could not, through the lobbyist's own prior job
      rather than through the lobbied entity.

      Built on the finding that the field is far more usable than an
      earlier assessment recorded. That assessment called it "~8%
      populated" and closed dual_role on it; the figure was actually the
      share of values naming a *committee*, and the field is populated
      for roughly a third of lobbyists, two thirds of whom name a
      *member* instead. Members resolve to committee seats through
      congress-legislators, which is the route that was never evaluated.

      What the pattern can see is bounded by two things it reports
      rather than hides: most lobbyists disclose no covered position at
      all, and references to members who have left office do not resolve
      against a current-only roster — which is the largest category of
      what it drops.
    citations:
      - source: oecd_lobbying_21c
        stance: supports
        because: >-
          Names the revolving door between private and public office as
          a principal integrity risk, and notes few countries impose
          cooling-off periods on the legislative branch. This pattern
          targets exactly the movement that concern describes.
      - source: oecd_lobbying_principles
        stance: supports
        because: >-
          Treats post-employment movement as a transparency and
          integrity matter the standard expects a regime to address.
          `covered_position` exists because US law requires this
          disclosure; reading it is using the regime as intended.
      - source: idea_lobbying_registers_2024
        stance: limits
        because: >-
          Register coverage is partial by design. Two thirds of
          lobbyists disclose no covered position, and the field is free
          text, so absence is not evidence of no prior service and
          coverage is a floor rather than a census.

  employer_contribution_clusters:
    status: SUPPORTED
    note: >-
      People sharing an employer who give to one recipient inside a
      short window. Schedule A alone. Renamed from
      conduit_contribution_cluster before being built: "conduit"
      asserts the mechanism the pattern cannot establish, and the same
      shape is produced by lawful workplace fundraising. The output is
      a lead.

      Verified against the case that grounds it. MUR 8363 conciliated
      with Calspan Corporation over contributions reimbursed with
      corporate funds; the pattern's top cluster for that employer is
      four donors to one campaign on a single day, comprising every
      individual the matter names. A first attempt found nothing,
      because it required three donors and excluded nothing: the
      scheme ran two at a time, and pass-through committees supplied
      roughly three quarters of the rows as small recurring donations.
      Both are now design parameters rather than assumptions.

      Clusters where every donor gave an identical amount are flagged
      separately. A reimbursement is a fixed sum per person; colleagues
      giving independently rarely match to the dollar. That flag is the
      closest thing to a discriminator available here, and it is
      suggestive rather than decisive.
    citations:
      - source: fec_murs
        stance: supports
        because: >-
          "Contributions-In the name of another" is a standing
          enforcement category and 52 USC 30122 among the most cited
          statutes in dispositions. MUR 8363 is the shape exactly, and
          its facts are recoverable from Schedule A.
      - source: ti_political_finance_standards
        stance: supports
        because: >-
          Clean money is one of the six principles. A contribution whose
          true source is concealed is the case that principle addresses.
      - source: oecd_lobbying_21c
        stance: limits
        because: >-
          Notes that disclosure regimes fail to capture indirect routes.
          Employer is self-reported free text and pass-through
          committees hide the eventual recipient, so any cluster count
          is a floor.

  common_vendor_overlap:
    status: SUPPORTED
    note: >-
      Vendors paid by both a candidate's campaign and an outside group
      spending independently to elect them. Built from Schedule B on the
      campaign side and Schedules E and B on the outside-spender side.

      The schedule split was the thing that had to be measured rather
      than assumed. An independent-expenditure committee reports its
      media buys on Schedule E under a separate payee field and carries
      almost nothing on Schedule B — one such committee had a single
      Schedule B row against millions in reported expenditures. A
      Schedule-B-only comparison, which is what "intersect the
      disbursements" implies, would find essentially nothing.

      Coordination is a legal conclusion resting on facts no filing
      discloses, and sharing a vendor is lawful where the firm
      firewalls its teams. The output is the overlap and what each side
      paid, never a claim about coordination.

      Commodity vendors dominate a raw overlap list — every committee
      buys the same airlines, rideshare and shipping. Each vendor
      therefore carries its share of each side's spending, which is what
      separates a consultancy taking real money from both from an
      airline taking a rounding error.
    citations:
      - source: fec_murs
        stance: supports
        because: >-
          "Expenditures-Coordinated" is a recurring enforcement subject,
          so the conduct is pursued rather than merely theorised.
      - source: oecd_lobbying_21c
        stance: limits
        because: >-
          Indirect routes go unrecorded. A shared vendor is one
          observable trace of a relationship disclosure does not
          otherwise capture, so overlap understates any real
          relationship and its absence shows nothing.
      - source: ti_political_finance_standards
        stance: limits
        because: >-
          A level playing field is one of the six principles, but the
          principle speaks to the arrangement rather than to any test
          for it. Nothing here establishes that a shared vendor breaches
          it.

  candidate_support_ratio:
    status: SUPPORTED
    note: >-
      What share of a committee's spending reaches candidates and party
      committees, against what it spends on its own operations.

      Renamed from scam_pac_ratio, and the reason is a correction worth
      keeping. That entry cited the FEC's "Fraudulent misrepresentation"
      enforcement subject as evidence the conduct was pursued. Checking
      the statute behind that label — 52 USC 30124 — shows it prohibits
      impersonating a candidate or party while soliciting, which is a
      different thing entirely from a committee lawfully spending its
      receipts on overhead. The subject was read as though the
      colloquial phrase "scam PAC" were a legal category. It is not, and
      no law requires any particular ratio.

      So the pattern keeps the measurement and drops the accusation. A
      low share is lawful and often legitimate: an independent
      expenditure or issue-advocacy group is not meant to give money to
      candidates, and a new committee spends before it gives.

      The FEC already computes both percentages. They are surfaced
      rather than recalculated, so a reader can reconcile against the
      agency's own figure. What is added is the receipts floor, without
      which a committee that raised a few thousand dollars reads as 100%
      overhead on the strength of one invoice, and the cycle-by-cycle
      view that distinguishes a young committee from a persistent one.
    citations:
      - source: ti_political_finance_standards
        stance: supports
        because: >-
          Accountability is among the six principles. Whether money
          solicited in a cause's name reaches candidates is the narrow
          factual question that principle turns on, independent of
          whether any rule was broken.
      - source: fec_murs
        stance: limits
        because: >-
          Cited here to record what the enforcement archive does *not*
          support. Its "Fraudulent misrepresentation" subject covers
          52 USC 30124, impersonating a candidate while soliciting — not
          a committee's spending mix. Nothing in the archive makes a low
          ratio actionable, and reading the subject label as though it
          did was the error this entry corrects.

# Planned but not built. Recorded with their grounding so the decision
# is informed before the work starts.
proposed:

  timing_correlation:
    status: CONTESTED
    note: >-
      Correlating contribution timing against roll-call votes. Not
      built, and the literature is a reason not to.
    citations:
      - source: hall_wayman_1990
        stance: contradicts
        because: >-
          Systematic research on contributions and floor voting provides
          little supporting evidence — which is the paper's own starting
          point and the reason it looks at committee participation
          instead. A votes-based pattern would rest on the weakest link
          in the field.
      - source: kalla_broockman_2016
        stance: contradicts
        because: >-
          Finds contributions buy access, not votes. Points away from a
          vote-outcome framing.

  dual_role:
    status: PROPOSED
    note: >-
      A lobbyist for a client who also funds a member sitting on a
      committee that client lobbies before. Not buildable as specified:
      LDA records the chamber lobbied, never the committee. Closed, and
      superseded by revolving_door, which is built and reaches
      committees through the lobbyist's disclosed prior employment
      instead of through the lobbied entity.
    citations:
      - source: idea_lobbying_registers_2024
        stance: limits
        because: >-
          Comparative analysis of register coverage. The missing
          committee-level field is a known regime gap, not an oversight
          in this implementation.





  foreign_national_contributions:
    status: CONTESTED
    note: >-
      Contributions recorded against a non-US address. Cheap from
      Schedule A, and 52 USC 30121(a)(2) is the third most cited statute
      in sampled dispositions (441 citations).

      The enforcement record is strong evidence the *conduct* is real
      and pursued, and evidence *against* this particular test finding
      it. Both readings come from the same source, which is why the
      citations below take opposite stances. Recorded so the citation
      count does not later look like a mandate to build it.
    citations:
      - source: fec_murs
        stance: supports
        because: >-
          Foreign Nationals is a standing subject (41 of 600 sampled
          MURs) with heavy statutory citation, so the conduct is real
          and prosecuted rather than theoretical.
      - source: fec_murs
        stance: contradicts
        because: >-
          The same files undercut an address test as the way to find it.
          The schemes pursued route through domestic straw donors and
          LLCs carrying US addresses, while lawful contributions from
          citizens abroad and permanent residents carry foreign ones —
          so the test inverts, catching the lawful and missing the
          prosecuted.

  foreign_principal_lobbying:
    status: SUPPORTED
    note: >-
      LDA filings naming a foreign parent or beneficiary in
      `foreign_entities`. Confirmed live and populated on 3.0% of a
      200-filing 2024 sample, naming the parent directly (Huawei behind
      Futurewei; Kolon Group behind a US firm's engagement).

      Sparse, and it is the narrower of the two foreign-influence
      registers — FARA is the other and packed does not have it. Worth
      recording as a data gap as much as a pattern.
    citations:
      - source: oecd_lobbying_21c
        stance: supports
        because: >-
          Identifies foreign officials and diplomats as influence actors
          that lobbying regulation frequently fails to cover.
      - source: idea_lobbying_registers_2024
        stance: limits
        because: >-
          A 3% disclosure rate is a register-coverage figure, not a
          measure of foreign involvement in US lobbying.
