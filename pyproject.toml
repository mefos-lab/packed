[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "packed"
version = "0.1.0"
description = "MCP server that cross-references PAC contributions, federal lobbying activity, and dark-money spending"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    # mcp 2.x. The 1.x -> 2.x break (removal of the @server.list_tools() /
    # @server.call_tool() decorator API) is absorbed by packed/mcp_compat.py,
    # which keeps this server's hand-authored tool schemas verbatim rather
    # than letting 2.0 derive them from function signatures. Floor is 2.0
    # because that shim targets the tool-manager API.
    "mcp>=2,<3",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    # Shared name normalization and matching. Extracted from the duplicated
    # implementations that had accumulated here and in sift; see the onoma
    # README for why it exists and what it deliberately does not decide.
    "onoma>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["packed"]
# The pattern provenance registry lives outside the package directory so
# it reads as project data rather than code, but it is loaded at runtime
# by packed/provenance.py — an installed wheel without it raises on the
# first PatternMatch. Ship it.
force-include = { "patterns" = "packed/patterns" }

[project.scripts]
packed = "packed.server:main"
